# esec vault server configuration. Scalar settings can be overridden with an
# ESEC_SERVER_* environment variable. Secrets come only from the environment:
# ESEC_SERVER_GITHUB_CLIENT_SECRET and ESEC_SERVER_BOOTSTRAP_TOKEN (required;
# it authorizes creating accounts).
base_url = "https://vault.example.com"
listen = ":8080"
db_path = "/data/esec-vault.db"
vault_history = 50
# Set when a trusted proxy supplies the client address (Fly.io does).
client_ip_header = "Fly-Client-IP"
# Emergency switch: "closed" refuses brand-new devices and browsers; trusted
# devices and browsers that signed in before keep working.
new_devices = "open"
max_orgs_per_account = 10 # self-service organisations created per account

[github]
client_id = "REPLACE_WITH_OAUTH_APP_CLIENT_ID"

[access]
# Numeric GitHub user IDs (gh api user --jq .id). Never usernames: a
# username can be renamed and later claimed by someone else.
allowed_github_ids = [
  53101343, # mscno (owner)
]
# Who may open the read-only admin pages (/admin): every account's devices,
# activity and storage, and the server's status. Each must also be allowed.
admin_github_ids = [
  53101343, # mscno (owner)
]
# Optional: reserve known personal handles before these allowlisted users join.
# reserved_github_handles = { mscno = 53101343 }

[sessions]
idle = "720h"      # 30 days
absolute = "2160h" # 90 days

# Security alerts: new, approved, suspended and revoked devices, and web
# sign-ins from new browsers. Email goes through Lettermint and needs
# ESEC_SERVER_LETTERMINT_TOKEN; a webhook needs ESEC_SERVER_ALERT_WEBHOOK_URL
# (and optionally ESEC_SERVER_ALERT_WEBHOOK_SECRET). Without them, no alerts.
# [alerts]
# email_from = "esec vault <vault@example.com>"
# email_to = ["security@example.com"]

# Optional migration/reservation overrides, not required for new organisations.
# Initial owners must be allowlisted.
# These reservations persist in the database; removing a config entry does
# not release a name. For an existing personal prefix, set kind = "personal".
# [[namespaces]]
# name = "geoman"
# owner_github_id = 53101343
#
# [[namespaces]]
# name = "paraplyventures"
# owner_github_id = 53101343
