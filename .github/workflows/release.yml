name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require passing tests for this exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow go-test.yml --commit "$GITHUB_SHA" --branch master --event push --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Extract release changelog
        run: |
          version=${GITHUB_REF#refs/tags/}
          mkdir -p tmp
          awk -v version="$version" '
            $0 == "# " version { found=1; next }
            found && /^# / { exit }
            found { print }
          ' CHANGELOG.md > tmp/release_changelog.md
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=tmp/release_changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Sign .tar.gz"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
      - name: "Attest checksums"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/checksums.txt"
      - name: "Attest SBOMs"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.sbom.json"
      - name: "Attest source archive"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*_source.tar.gz"

  macos:
    needs: release
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and verify app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export ESEC_VERSION="${RELEASE_TAG#v}"
          swift test --package-path macos/EsecVault
          macos/EsecVault/bundle.sh
          codesign --verify --deep --strict macos/EsecVault/build/EsecVault.app
      - name: Publish app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          artifact="EsecVault_${RELEASE_TAG#v}_darwin_${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent macos/EsecVault/build/EsecVault.app "$artifact"
          shasum -a 256 "$artifact" > "$artifact.sha256"
          gh release upload "$RELEASE_TAG" "$artifact" "$artifact.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: EsecVault_*.zip
