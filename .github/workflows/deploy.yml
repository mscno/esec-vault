name: Deploy server

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-vault
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require a published release for manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.0
      - name: Deploy the verified release
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config deploy/fly.production.toml --build-arg VERSION="$(git describe --tags --always)"
      - name: Check production health
        run: curl --fail --retry 6 --retry-delay 5 --retry-all-errors https://vault.parap.ly/healthz
