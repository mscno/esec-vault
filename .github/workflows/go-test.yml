name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: "go test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The broker uses unix sockets with peer credentials; both supported
        # platforms are exercised. Windows runs compile-only checks.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version-file: go.mod
      - name: Test
        run: |
          go mod download
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...

  cross:
    name: Build every release target
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version-file: go.mod
      - name: Build
        run: |
          for os in darwin freebsd linux windows; do
            for arch in amd64 arm64; do
              echo "$os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
            done
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          cache: true
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in step with mise.toml.
          version: v2.15.0
