name: Native diagnostics
on:
  push:
    branches: [debug/native-ci]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '26.3'
            args: ''
          - runner: macos-15
            xcode: '26.3'
            args: '--disable-xctest'
          - runner: macos-26
            xcode: '26.6'
            args: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 7
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      TEST_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v7
      - name: Run with bounded hang diagnostics
        run: python3 scripts/diagnose-swift.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.runner }}-${{ strategy.job-index }}
          path: /tmp/native-diagnostics
