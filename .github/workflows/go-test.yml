name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    name: "go test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The broker uses unix sockets with peer credentials; both supported
        # platforms are exercised. Windows runs compile-only checks.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          cache: true
          go-version-file: go.mod
      - name: Test
        run: |
          go mod download
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          cache: true
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
